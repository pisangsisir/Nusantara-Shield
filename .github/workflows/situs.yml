# Menerbitkan folder situs/ ke GitHub Pages setiap kali master berubah di situs/.
# Isi situs dibangun di komputer pembuat rilis (tools/bangun_situs.py) lalu di-commit; alur ini hanya menyalin.
name: Terbitkan situs
on:
  push:
    branches: [master]
    paths: ["situs/**", ".github/workflows/situs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  terbit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: situs
      - id: terbit
        uses: actions/deploy-pages@v4
